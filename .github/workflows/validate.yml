name: Validate BAH BUSINESS

on:
  push:
    branches: [bah-business]
  pull_request:
    branches: [bah-business]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required PWA files
        run: test -f index.html && test -f style.css && test -f app.js && test -f manifest.webmanifest && test -f sw.js
